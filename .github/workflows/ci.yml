name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install tesseract --yes --no-progress

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python -m unittest discover -v

      - name: Compile Python files
        run: uv run python -m compileall main.py core gui platforms tests

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install tesseract --yes --no-progress

      - name: Install Python dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          export TESSERACT_CMD="$(which tesseract)"
          export TESSDATA_PREFIX="$(brew --prefix)/share/tessdata"
          uv run pyinstaller --clean --noconfirm packaging/blurveil.spec
          test -d dist/Blurveil.app

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:TESSERACT_CMD = "C:\Program Files\Tesseract-OCR\tesseract.exe"
          $env:TESSDATA_PREFIX = "C:\Program Files\Tesseract-OCR\tessdata"
          uv run pyinstaller --clean --noconfirm packaging\blurveil.spec
          if (!(Test-Path "dist\Blurveil\Blurveil.exe")) {
            throw "dist\Blurveil\Blurveil.exe was not created"
          }
