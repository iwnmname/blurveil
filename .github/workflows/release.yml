name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: brew install tesseract

      - name: Install Python dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Build app bundle
        run: |
          export TESSERACT_CMD="$(which tesseract)"
          export TESSDATA_PREFIX="$(brew --prefix)/share/tessdata"
          uv run pyinstaller --clean --noconfirm packaging/blurveil.spec

      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist/installers dist/dmg-root
          cp -R dist/Blurveil.app dist/dmg-root/Blurveil.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "Blurveil" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            "dist/installers/Blurveil-${VERSION}-macOS.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: blurveil-macos
          path: dist/installers/*.dmg

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        shell: powershell
        run: |
          choco install tesseract --yes --no-progress
          choco install innosetup --yes --no-progress

      - name: Install Python dependencies
        shell: powershell
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Build executable
        shell: powershell
        run: |
          $env:TESSERACT_CMD = "C:\Program Files\Tesseract-OCR\tesseract.exe"
          $env:TESSDATA_PREFIX = "C:\Program Files\Tesseract-OCR\tessdata"
          uv run pyinstaller --clean --noconfirm packaging\blurveil.spec

      - name: Build installer and portable zip
        shell: powershell
        run: |
          $version = "${env:GITHUB_REF_NAME}"
          if (-not $version) { $version = "dev" }
          $version = $version.TrimStart("v")
          New-Item -ItemType Directory -Force -Path dist\installers | Out-Null
          $env:APP_VERSION = $version
          $env:APP_SOURCE_DIR = (Resolve-Path "dist\Blurveil").Path
          $env:APP_OUTPUT_DIR = (Resolve-Path "dist\installers").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\blurveil.iss
          Compress-Archive -Path dist\Blurveil\* -DestinationPath "dist\installers\Blurveil-$version-Windows-portable.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: blurveil-windows
          path: |
            dist/installers/*.exe
            dist/installers/*.zip

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Blurveil release $TAG_NAME"
          gh release upload "$TAG_NAME" release-assets/* --clobber
